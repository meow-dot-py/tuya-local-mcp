[project]
name = "tuya-local-mcp"
version = "0.2.2"
description = "Zero-cloud LAN controller for Tuya / Smart Life bulbs: an MCP server for Claude Code plus a TrueColor CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johann 'M' Nestorida" }]
keywords = ["tuya", "smart-life", "smart-home", "mcp", "claude-code", "tinytuya", "lights"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "tinytuya>=1.17",
    # The server uses the MCP Python SDK v2 API (mcp.server.mcpserver.MCPServer).
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/meow-dot-py/tuya-local-mcp"
Issues = "https://github.com/meow-dot-py/tuya-local-mcp/issues"

[project.scripts]
tuya-local-mcp = "tuya_local_mcp.cli:entry"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuya_local_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
