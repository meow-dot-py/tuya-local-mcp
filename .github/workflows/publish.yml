# Publishes to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing: no API token is stored anywhere. One-time setup on
# pypi.org -> Your projects / Publishing -> add a (pending) GitHub publisher:
#   project tuya-local-mcp, owner meow-dot-py, repository tuya-local-mcp,
#   workflow publish.yml, environment pypi
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - name: Check the tag matches the package version
        run: |
          version=$(uv run python -c "import tuya_local_mcp; print(tuya_local_mcp.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
